name: DeltaListLifecycle
options:
  projectFormat: xcode15_3
  bundleIdPrefix: com.latenighthack.deltalist.tests
settings:
  base:
    SWIFT_VERSION: '5.0'
    'FRAMEWORK_SEARCH_PATHS[sdk=macosx*]': '$(inherited) $(SRCROOT)/../../deltalist-core/build/bin/macosArm64/debugFramework $(SRCROOT)/../../demo-core/build/bin/macosArm64/debugFramework'
    'FRAMEWORK_SEARCH_PATHS[sdk=iphonesimulator*]': '$(inherited) $(SRCROOT)/../../deltalist-core/build/bin/iosSimulatorArm64/debugFramework $(SRCROOT)/../../demo-core/build/bin/iosSimulatorArm64/debugFramework'
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGNING_ALLOWED: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    LD_RUNPATH_SEARCH_PATHS: '$(inherited) @executable_path/Frameworks @loader_path/Frameworks'
targets:
  LifecycleHostIOS:
    type: application
    platform: iOS
    deploymentTarget: '15.0'
    sources: [Sources]
    settings:
      base:
        TARGETED_DEVICE_FAMILY: '1,2'
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    dependencies:
      - framework: ../../deltalist-core/build/bin/iosSimulatorArm64/debugFramework/DeltaListCore.framework
        embed: true
      - framework: ../../demo-core/build/bin/iosSimulatorArm64/debugFramework/DemoCore.framework
        embed: false
  LifecycleTestsIOS:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: '15.0'
    sources: [Tests]
    dependencies:
      - target: LifecycleHostIOS
      - framework: ../../deltalist-core/build/bin/iosSimulatorArm64/debugFramework/DeltaListCore.framework
        embed: false
      - framework: ../../demo-core/build/bin/iosSimulatorArm64/debugFramework/DemoCore.framework
        embed: false
  LifecycleHostMac:
    type: application
    platform: macOS
    deploymentTarget: '12.0'
    sources: [Sources]
    dependencies:
      - framework: ../../deltalist-core/build/bin/macosArm64/debugFramework/DeltaListCore.framework
        embed: true
      - framework: ../../demo-core/build/bin/macosArm64/debugFramework/DemoCore.framework
        embed: false
  LifecycleTestsMac:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: '12.0'
    sources: [Tests]
    dependencies:
      - target: LifecycleHostMac
      - framework: ../../deltalist-core/build/bin/macosArm64/debugFramework/DeltaListCore.framework
        embed: false
      - framework: ../../demo-core/build/bin/macosArm64/debugFramework/DemoCore.framework
        embed: false
schemes:
  LifecycleIOS:
    build:
      targets:
        LifecycleHostIOS: all
    test:
      targets: [LifecycleTestsIOS]
  LifecycleMac:
    build:
      targets:
        LifecycleHostMac: all
    test:
      targets: [LifecycleTestsMac]
