name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jvm-js-android:
    name: JVM + JS tests, Android/JS assembly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run common tests on JVM
        run: ./gradlew :deltalist-core:jvmTest --stacktrace

      - name: Run common tests on JS (node)
        run: ./gradlew :deltalist-core:jsNodeTest --stacktrace

      - name: Run Android binding unit tests
        run: ./gradlew :deltalist-android-notifications:testDebugUnitTest :deltalist-android-recyclerview:testDebugUnitTest :deltalist-android-compose:testDebugUnitTest --stacktrace

      - name: Assemble Android library modules
        run: ./gradlew :deltalist-android-recyclerview:assembleRelease :deltalist-android-compose:assembleRelease :deltalist-android-notifications:assembleRelease --stacktrace

      - name: Compile JS / React module
        run: ./gradlew :deltalist-react:compileKotlinJs --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jvm-js-test-reports
          path: '**/build/reports/tests/**'
          if-no-files-found: ignore

  apple:
    name: Apple tests + macOS link + XCFramework
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run common tests on iOS simulator
        run: ./gradlew :deltalist-core:iosSimulatorArm64Test --stacktrace

      - name: Compile macOS targets
        run: ./gradlew :deltalist-core:compileKotlinMacosArm64 :deltalist-core:compileKotlinMacosX64 --stacktrace

      # Linking is what compiles the bundled Swift under src/commonMain/swift. Without this the
      # AppKit-only DeltaNSCollectionDataSource (+Sectioned/+Stable/DeltaNSRows) is never
      # type-checked by CI.
      - name: Link macOS framework (compiles the AppKit bundled Swift)
        run: ./gradlew :deltalist-core:linkDebugFrameworkMacosArm64 :deltalist-core:linkDebugFrameworkMacosX64 --stacktrace

      # Same for the demo module's AppKit bundled Swift (DeltaNSDataSourceExtensions), which the
      # macOS demo (demo-ios/DemoAppMac) links.
      - name: Link demo-core macOS framework (compiles demo AppKit bundled Swift)
        run: ./gradlew :demo-core:linkDebugFrameworkMacosArm64 :demo-core:linkDebugFrameworkMacosX64 --stacktrace

      - name: Assemble release XCFramework
        run: ./gradlew :deltalist-core:assembleDeltaListCoreReleaseXCFramework --stacktrace

      - name: Upload Apple test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apple-test-reports
          path: '**/build/reports/tests/**'
          if-no-files-found: ignore
